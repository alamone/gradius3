name: 検証ボット

# 「検証」Issue のコメントコマンド（/claim /check /done /human /release /items）を処理する。
# 協力者にリポジトリの権限を渡さなくても、コメントだけで担当・進捗・結果が記録される。
# 初回だけ Actions タブ → 検証ボット → Run workflow でラベルを作成する。

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  schedule:
    - cron: '17 21 * * *'   # 毎日 6:17（日本時間）に、3日間報告のない担当を未着手に戻す
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: verify-bot-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  bot:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const bot = require('./.github/scripts/verify-bot.js');
            await bot({ github, context, core });
